name: Build and Release Traefik Plugin Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release Traefik Plugin (.cspkg)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Run Unit Tests
        run: |
          npm run test:ts

      - name: Build Plugin Bundle (main.js)
        run: |
          npm run build

      - name: Install cspkg packager
        run: |
          sudo curl -sSL -f -L https://github.com/EdvardBaldanov/config-studio-plugin-docs/releases/download/v1.0.0/cspkg-linux-amd64 -o /usr/local/bin/cspkg
          sudo chmod +x /usr/local/bin/cspkg
          cspkg version

      - name: Compile .cspkg binary package
        run: |
          PLUGIN_ID=$(jq -r '.id' plugin.json)
          PLUGIN_VERSION=$(jq -r '.version' plugin.json)
          echo "Packaging ${PLUGIN_ID} v${PLUGIN_VERSION}..."
          
          # Create versioned and latest .cspkg
          cspkg pack . -o "${PLUGIN_ID}-${PLUGIN_VERSION}.cspkg"
          cp "${PLUGIN_ID}-${PLUGIN_VERSION}.cspkg" "${PLUGIN_ID}.cspkg"
          
          # Verify integrity
          cspkg inspect "${PLUGIN_ID}-${PLUGIN_VERSION}.cspkg"

      - name: Create fallback ZIP archive
        run: |
          PLUGIN_ID=$(jq -r '.id' plugin.json)
          zip -r "${PLUGIN_ID}.zip" plugin.json main.js style.css README.md

      - name: Generate Checksums (SHA-256)
        run: |
          sha256sum *.cspkg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.cspkg
            *.zip
            SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
